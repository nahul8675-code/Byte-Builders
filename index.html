<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Byte-Builders | Educational Tech Lab</title>
  <style>
    :root {
      --bg-cream: #F9F6F3;
      --surface-sand: #DBD0C5;
      --text-main: #1F1D1B;
      --btn-walnut: #885E43;
      --accent-tan: #C39A7A;
      --border-subtle: #C8BCB0;
      --card-bg: #FFFFFF;
      --cyan: #885E43;
      --border: #DBD0C5;
      --text-muted: #6B6560;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-main);
      line-height: 1.6;
      padding: 0;
    }

    header {
      background-color: var(--surface-sand);
      border-bottom: 2px solid var(--border-subtle);
      padding: 32px 16px;
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 16px;
    }

    .controls-bar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 30px;
      background: var(--surface-sand);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    @media(min-width: 700px) {
      .controls-bar {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .search-input {
      width: 100%;
      max-width: 350px;
      padding: 12px 16px;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 0.95rem;
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      padding: 8px 14px;
      border: 1px solid var(--border-subtle);
      background-color: var(--card-bg);
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .filter-btn.active, .filter-btn:hover {
      background-color: var(--btn-walnut);
      color: #FFFFFF;
      border-color: var(--btn-walnut);
    }

    .tutorial-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .tut-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(31, 29, 27, 0.04);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .tut-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(31, 29, 27, 0.08);
    }

    .tut-graphic {
      background-color: var(--bg-cream);
      border-radius: 6px;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
      border: 1px solid var(--border-subtle);
    }

    .chip-illustration {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--btn-walnut);
      margin-bottom: 4px;
    }

    .tut-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .tut-tag {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--btn-walnut);
      background-color: rgba(136, 94, 67, 0.1);
      padding: 3px 8px;
      border-radius: 4px;
    }

    .meta-badges {
      display: flex;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .tut-body h3 {
      font-size: 1.15rem;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .items-preview {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .btn-primary {
      background-color: var(--btn-walnut);
      color: #FFFFFF;
      border: none;
      padding: 12px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      width: 100%;
      transition: opacity 0.2s;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(31, 29, 27, 0.65);
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-container {
      background-color: var(--card-bg);
      border-radius: 10px;
      width: 100%;
      max-width: 750px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 30px;
      position: relative;
      box-shadow: 0 10px 30px rgba(31, 29, 27, 0.2);
    }

    .close-modal {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--bg-cream);
      border: 1px solid var(--border-subtle);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-section {
      margin-bottom: 20px;
    }

    .modal-section h4 {
      font-size: 1rem;
      color: var(--btn-walnut);
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 4px;
    }

    pre {
      background-color: var(--bg-cream);
      padding: 14px;
      border-radius: 6px;
      overflow-x: auto;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
    }

    .wiring-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .wiring-table th, .wiring-table td {
      border: 1px solid var(--border-subtle);
      padding: 10px;
      text-align: left;
    }

    .wiring-table th {
      background-color: var(--surface-sand);
      color: var(--text-main);
    }

    .pin-badge {
      background-color: rgba(195, 154, 122, 0.2);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    .code-wrapper {
      position: relative;
    }

    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: var(--btn-walnut);
      color: #fff;
      border: none;
      padding: 6px 10px;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--border-subtle);
      margin-top: 60px;
      background-color: var(--surface-sand);
    }
  </style>
</head>
<body>

  <header>
    <h1>Byte-Builders Lab</h1>
    <p>Educational Tech Tutorials, Microcontrollers, Python & Cybersecurity Guides</p>
  </header>

  <main class="container" id="tutorials">
    <div class="controls-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="Search tutorials or concepts...">
      <div class="filter-buttons">
        <button class="filter-btn active" data-category="All">All</button>
        <button class="filter-btn" data-category="Arduino">Arduino</button>
        <button class="filter-btn" data-category="Robotics">Robotics</button>
        <button class="filter-btn" data-category="Python">Python</button>
        <button class="filter-btn" data-category="Cybersecurity">Cybersecurity</button>
      </div>
    </div>

    <!-- Dynamic Tutorial Grid -->
    <div id="tutorialGrid" class="tutorial-grid"></div>
  </main>

  <!-- Interactive Modal Popup -->
  <div id="tutorialModal" class="modal-overlay">
    <div class="modal-container">
      <button class="close-modal" onclick="closeTutorial()">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer>
    <p>© 2026 Byte-Builders. Build. Code. Explore.</p>
  </footer>

  <!-- Link script file -->
  <script src="script.js"></script>
</body>
</html>
